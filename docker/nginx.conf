worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ${PASSIT_CONNECT_SOURCES}; frame-ancestors 'none'" always;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /runtime-config.json {
            alias /tmp/passit-runtime-config.json;
            default_type application/json;
            # Inherit security headers; force a fresh config on each app load.
            expires -1;
        }
        location /api/ {
            proxy_pass ${PASSIT_API_UPSTREAM};
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_read_timeout 65s;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
