name: Build and publish images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passit-${{ github.workflow }}-${{ github.ref }}
  # Let main publications complete; newer feature pushes can replace pending snapshots.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TRIVY_VERSION: '0.75.0'

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.19'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: npm --prefix frontend ci --ignore-scripts
      - run: .venv/bin/ruff check backend scripts
      - run: .venv/bin/ruff format --check backend scripts
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: bash -n scripts/*.sh && sh -n docker/start-web.sh

  tests:
    name: Application and browser tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: passit
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: passit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passit -d passit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.19'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: npm --prefix frontend ci --ignore-scripts
      - run: .venv/bin/pytest -q
      - name: PostgreSQL concurrency tests
        run: .venv/bin/pytest -q
        env:
          # Dedicated to tests: fixtures recreate its application tables.
          PASSIT_TEST_DATABASE_URL: postgresql+psycopg://passit:local-ci-only@localhost:5432/passit_test
      - run: npm --prefix frontend run build
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Browser workflows
        shell: bash
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m passit.manage seed
          bash scripts/dev.sh > /tmp/passit-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/api/config > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"
          .venv/bin/python backend/tests/browser_smoke.py
          .venv/bin/python backend/tests/browser_languages.py
          .venv/bin/python backend/tests/browser_statistics.py
          .venv/bin/python backend/tests/browser_user_blocking.py
          .venv/bin/python backend/tests/browser_guardrails.py

  security:
    name: Trivy source scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: Scan dependencies, secrets and configuration
        run: >-
          trivy fs --scanners vuln,secret,misconfig --include-dev-deps --severity HIGH,CRITICAL
          --exit-code 1 --format json --output trivy-source.json .
      - name: Preserve scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-source
          path: trivy-source.json
          if-no-files-found: warn
          retention-days: 7

  image-build:
    name: Build ${{ matrix.component }} image
    needs: security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          tags: passit-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          pull: true
      - name: Check web startup with a read-only filesystem
        if: matrix.component == 'web'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/web_smoke.sh "passit-web:$COMMIT_SHA"
      - name: Save the built image
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker save "passit-$COMPONENT:$COMMIT_SHA" -o "$COMPONENT.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar
          retention-days: 1

  image-scan:
    name: Scan ${{ matrix.component }} image
    needs: image-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.component }}
      - name: Load the exact built image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker load --input "$COMPONENT.tar"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: Scan the image that will be deployed
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1
          --format json --output "trivy-$COMPONENT.json" "passit-$COMPONENT:$COMMIT_SHA"
      - name: Preserve image scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 7

  registry-push:
    name: Publish snapshot or release to ACR
    needs: image-scan
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: ${{ vars.AZURE_REGISTRY_ENVIRONMENT || 'registry' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push and lock the scanned image pair
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_id }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: python scripts/azure_deploy.py publish --images images
