name: Checks and Azure test deployment

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images_only:
        description: Publish scanned images to your existing registry for first-time manual setup
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: passit-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a main release midway through a database migration.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TRIVY_VERSION: '0.75.0'

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.19'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: npm --prefix frontend ci --ignore-scripts
      - run: .venv/bin/ruff check backend scripts/azure_deploy.py
      - run: .venv/bin/ruff format --check backend scripts/azure_deploy.py
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: bash -n scripts/dev.sh scripts/install.sh && sh -n docker/start-web.sh

  tests:
    name: Application and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: passit
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: passit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passit -d passit_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.19'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: npm --prefix frontend ci --ignore-scripts
      - run: .venv/bin/pytest -q
      - name: PostgreSQL concurrency tests
        run: .venv/bin/pytest -q
        env:
          # Dedicated to tests: fixtures recreate its application tables.
          PASSIT_TEST_DATABASE_URL: postgresql+psycopg://passit:local-ci-only@localhost:5432/passit_test
      - run: npm --prefix frontend run build
      - run: .venv/bin/playwright install --with-deps chromium
      - name: Browser workflows
        shell: bash
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python -m passit.manage seed
          bash scripts/dev.sh > /tmp/passit-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5173/api/config > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"
          .venv/bin/python backend/tests/browser_smoke.py
          .venv/bin/python backend/tests/browser_languages.py
          .venv/bin/python backend/tests/browser_statistics.py
          .venv/bin/python backend/tests/browser_user_blocking.py
          .venv/bin/python backend/tests/browser_guardrails.py

  security:
    name: Trivy source scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: Scan dependencies, secrets and configuration
        run: >-
          trivy fs --scanners vuln,secret,misconfig --include-dev-deps --severity HIGH,CRITICAL
          --exit-code 1 --format json --output trivy-source.json .
      - name: Preserve scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-source
          path: trivy-source.json
          if-no-files-found: warn
          retention-days: 7

  containers:
    name: Build and scan ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          tags: passit-${{ matrix.component }}:${{ github.sha }}
          load: true
          pull: true
          # Public SPA settings live in repository variables, never VITE_* secrets.
          build-args: |
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE }}
      - name: Check web startup with a read-only filesystem
        if: matrix.component == 'web'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker run --detach --name web-smoke --publish 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp:size=32m,mode=1777 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PASSIT_API_UPSTREAM=http://127.0.0.1:8000 \
            --env "PASSIT_CONNECT_SOURCES='self' https://tenant.example.test" \
            "passit-web:$COMMIT_SHA"
          trap 'docker rm -f web-smoke >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/auth/callback \
            | python -c 'import sys; assert "<div id=\"root\">" in sys.stdin.read()'
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}
      - name: Scan the image that will be deployed
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: >-
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1
          --format json --output "trivy-$COMPONENT.json" "passit-$COMPONENT:$COMMIT_SHA"
      - name: Preserve image scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save the scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
        run: docker save "passit-$COMPONENT:$COMMIT_SHA" -o "$COMPONENT.tar"
      - name: Pass the scanned image to deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar
          retention-days: 1

  deploy-test:
    name: ${{ inputs.publish_images_only && 'Publish test images only' || 'Deploy to existing Azure test environment' }}
    needs: [lint, tests, security, containers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.AZURE_TEST_DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_images_only))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ vars.AZURE_TEST_ENVIRONMENT || 'test' }}
      url: ${{ steps.deploy.outputs.web_url }}
    concurrency:
      group: azure-${{ vars.AZURE_TEST_ENVIRONMENT || 'test' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare Container Apps CLI
        run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Deploy scanned images and check the app
        id: deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          AZURE_WEB_APP: ${{ vars.AZURE_WEB_APP }}
          AZURE_API_APP: ${{ vars.AZURE_API_APP }}
          AZURE_WORKER_APP: ${{ vars.AZURE_WORKER_APP }}
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_SCOPE: ${{ vars.VITE_OIDC_SCOPE }}
          COMMIT_SHA: ${{ github.sha }}
          PUBLISH_IMAGES_ONLY: ${{ inputs.publish_images_only || false }}
        run: |
          if [ "$PUBLISH_IMAGES_ONLY" = true ]; then
            python scripts/azure_deploy.py --images images --publish-only
          else
            python scripts/azure_deploy.py --images images
          fi
